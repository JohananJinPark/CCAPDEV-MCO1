<body>

    <div class="register-page">

        <div class="register-container">

            <!-- HEADER -->
            <div class="register-header">
                <a href="/" class="back-link">← Back to Home</a>

                <div class="logo">
                    <h1>AnimoLabs</h1>
                </div>

                <h2>Create your account</h2>
                <p>Lab Technician</p>

            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="e.g. Juan Dela Cruz" required>
                </div>

                <div class="form-group">
                    <label>DLSU Email Address</label>
                    <input type="email" id="regEmail" placeholder="username@dlsu.edu.ph" required>
                    <small>Must end with @dlsu.edu.ph</small>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPw" placeholder="Minimum 8 characters" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPw" placeholder="Re-enter your password" required>
                </div>

                <input type="hidden" id="regRole" value="technician">

                <button type="submit" class="submit-btn">Create Account</button>
            </form>
