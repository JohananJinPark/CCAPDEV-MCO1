<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Available Slots</title>
    <link rel="stylesheet" href="/search.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <h1>Search Available Slots</h1>
            <p>Find open seats across all labs based on your preferences</p>
        </div>


        <!-- SEARCH FILTER PANEL -->

        <div class="card">

            <h2>Search Filters</h2>

            <div class="filters">

                <div class="field">
                    <label>Laboratory</label>
                    <select>
                        <option value="">All Labs</option>
                        <option value="gokongwei">Gokongwei</option>
                        <option value="andrew">Andrew</option>
                        <option value="velasco">Velasco</option>
                    </select>
                </div>

                <div class="field">
                    <label>Date</label>
                    <select>
                        <!-- populated by SearchPage.buildDateDropdown() -->
                    </select>
                </div>

                <div class="field">
                    <label>From Time</label>
                    <select>
                        <!-- populated by SearchPage.buildTimeDropdowns() -->
                    </select>
                </div>

                <div class="field">
                    <label>Until Time</label>
                    <select>
                        <!-- populated by SearchPage.buildTimeDropdowns() -->
                    </select>
                </div>

            </div>

            <button class="search-btn">Search Available Slots</button>

        </div>


        <!-- RESULTS HEADER -->

        <div class="results-header">
            <h2>Search Results</h2>
            <p>Found <b>12</b> available seats</p>
        </div>


        <!-- RESULTS HEADER -->
        <div class="results-header">
            <h2>Search Results</h2>
            <p>Found <b>0</b> available seats</p>
        </div>

    
    </div>

    <script src="/app.js?v=2"></script>
</body>

</html>
